name: Rocket3D CI/CD Build Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install cadquery
      - name: Run Rocket3D Generation Script
        run: python3 app.py
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocket3d-outputs
          path: output/
